<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rayl Wheel</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2381817b'/%3E%3Crect x='6' y='11' width='20' height='10' rx='3' fill='%23dbdbd2'/%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="./assets/index-C6Xlwa8-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-RjDjRtLw.css">
  </head>
  <!-- Held until the panel has settled and the type has arrived. Set here
       rather than by script so it is true from the first paint, which is the
       paint it exists to prevent. -->
  <body class="starting">
    <main class="frame">
      <canvas id="stage"></canvas>
      <output class="status" id="status" aria-live="polite" hidden></output>
    </main>

    <aside class="panel">
      <div class="mark">
        <img src="./rayl-mark.svg" alt="Rayl" />
        <span><b>Rayl</b><img class="reg" src="./rayl-reg.svg" alt="" /></span>
      </div>

      <div class="scroll">
        <section class="group">
          <h2>View</h2>
          <div class="rows">
            <div class="segmented" data-select="projection">
              <button
                type="button"
                class="btn"
                data-value="perspective"
                data-span="half"
              >
                Perspective
              </button>
              <button
                type="button"
                class="btn"
                data-value="isometric"
                data-span="half"
              >
                Isometric
              </button>
            </div>
            <label class="ctl" id="lensRow">
              <span>Lens</span>
              <span class="track">
                <input
                  type="range"
                  id="fov"
                  min="10"
                  max="60"
                  step="1"
                  value="28"
                />
                <input class="nub" id="fovOut" value="28" readonly />
              </span>
            </label>
            <label class="ctl">
              <span>Size</span>
              <span class="track">
                <input
                  type="range"
                  id="fill"
                  min="0.4"
                  max="1"
                  step="0.01"
                  value="0.92"
                />
                <input class="nub" id="fillOut" value="0.92" readonly />
              </span>
            </label>
          </div>
        </section>

        <section class="group">
          <h2>Wheel</h2>
          <div class="rows">
            <label class="ctl">
              <span>Radius</span>
              <span class="track">
                <input
                  type="range"
                  id="radius"
                  min="0.8"
                  max="8"
                  step="0.05"
                  value="1.7"
                />
                <input class="nub" id="radiusOut" value="1.7" readonly />
              </span>
            </label>
            <label class="ctl">
              <span>Spacing</span>
              <span class="track">
                <input
                  type="range"
                  id="spacing"
                  min="-0.2"
                  max="1.2"
                  step="0.01"
                  value="0.1"
                />
                <input class="nub" id="spacingOut" value="0.1" readonly />
              </span>
            </label>
            <label class="ctl">
              <span>Arc</span>
              <span class="track">
                <input
                  type="range"
                  id="arc"
                  min="20"
                  max="90"
                  step="1"
                  value="82"
                />
                <input class="nub" id="arcOut" value="82" readonly />
              </span>
            </label>
            <label class="ctl">
              <span>Fade</span>
              <span class="track">
                <input
                  type="range"
                  id="fade"
                  min="0"
                  max="60"
                  step="1"
                  value="28"
                />
                <input class="nub" id="fadeOut" value="28" readonly />
              </span>
            </label>
          </div>
        </section>

        <section class="group">
          <h2>Cards</h2>
          <div class="rows">
            <label class="ctl">
              <span>Count</span>
              <span class="track">
                <input
                  type="range"
                  id="count"
                  min="1"
                  max="24"
                  step="1"
                  value="12"
                />
                <input class="nub" id="countOut" value="12" readonly />
              </span>
            </label>
            <label class="ctl">
              <span>Depth</span>
              <span class="track">
                <input
                  type="range"
                  id="depth"
                  min="0.4"
                  max="4"
                  step="0.05"
                  value="1"
                />
                <input class="nub" id="depthOut" value="1" readonly />
              </span>
            </label>
            <label class="ctl">
              <span>Finish</span>
              <span class="track">
                <input
                  type="range"
                  id="roughness"
                  min="0.1"
                  max="1"
                  step="0.01"
                  value="0.55"
                />
                <input class="nub" id="roughnessOut" value="0.55" readonly />
              </span>
            </label>
            <div class="segmented" data-select="surface">
              <button
                type="button"
                class="btn"
                data-value="colour"
                data-span="half"
              >
                Colour
              </button>
              <button
                type="button"
                class="btn"
                data-value="gradient"
                data-span="half"
              >
                Gradient
              </button>
            </div>
            <label class="ctl" id="colourRow">
              <span>Colour</span>
              <input type="color" id="colour" value="#f0f0ea" />
            </label>
            <label class="ctl" id="insideRow">
              <span>Inside</span>
              <input type="color" id="inside" value="#cecec5" />
            </label>
            <label class="ctl" id="edgesRow">
              <span>Edges</span>
              <input type="color" id="edges" value="#e7e7e0" />
            </label>
          </div>
        </section>

        <section class="group">
          <h2>Lighting</h2>
          <div class="rows">
            <div class="segmented" data-select="rig">
              <button
                type="button"
                class="btn"
                data-value="Soft"
                data-span="third"
              >
                Soft
              </button>
              <button
                type="button"
                class="btn"
                data-value="Studio"
                data-span="third"
              >
                Studio
              </button>
              <button
                type="button"
                class="btn"
                data-value="Sharp"
                data-span="third"
              >
                Sharp
              </button>
            </div>
            <label class="ctl">
              <span>Light</span>
              <span class="track">
                <input
                  type="range"
                  id="light"
                  min="0.2"
                  max="3"
                  step="0.05"
                  value="2.4"
                />
                <input class="nub" id="lightOut" value="2.4" readonly />
              </span>
            </label>
            <label class="ctl">
              <span>Shadow</span>
              <span class="track">
                <input
                  type="range"
                  id="shadow"
                  min="0"
                  max="1"
                  step="0.01"
                  value="0.45"
                />
                <input class="nub" id="shadowOut" value="0.45" readonly />
              </span>
            </label>
          </div>
        </section>

        <section class="group">
          <h2>Scroll</h2>
          <div class="rows">
            <div class="segmented" data-select="snap">
              <button
                type="button"
                class="btn"
                data-value="snap"
                data-span="half"
              >
                Snap
              </button>
              <button
                type="button"
                class="btn"
                data-value="free"
                data-span="half"
              >
                Free
              </button>
            </div>
            <label class="ctl">
              <span>Position</span>
              <span class="track">
                <input
                  type="range"
                  id="scroll"
                  min="0"
                  max="11"
                  step="0.01"
                  value="4"
                />
                <input class="nub" id="scrollOut" value="4" readonly />
              </span>
            </label>
          </div>
        </section>

        <section class="group">
          <h2>Loop</h2>
          <div class="rows">
            <div class="segmented" data-select="motion">
              <button
                type="button"
                class="btn"
                data-value="pong"
                data-span="half"
              >
                Ping-Pong
              </button>
              <button
                type="button"
                class="btn"
                data-value="cycle"
                data-span="half"
              >
                Cycle
              </button>
            </div>
            <label class="ctl" id="travelRow">
              <span>Travel</span>
              <span class="track">
                <input
                  type="range"
                  id="travel"
                  min="1"
                  max="12"
                  step="1"
                  value="6"
                />
                <input class="nub" id="travelOut" value="6" readonly />
              </span>
            </label>
            <label class="ctl" id="secondsRow">
              <span>Duration</span>
              <span class="track">
                <input
                  type="range"
                  id="seconds"
                  min="1"
                  max="20"
                  step="0.5"
                  value="6"
                />
                <input class="nub" id="secondsOut" value="6" readonly />
              </span>
            </label>
            <div class="segmented" data-select="curve">
              <button
                type="button"
                class="btn"
                data-value="In &amp; Out"
                data-span="half"
              >
                In &amp; Out
              </button>
              <button
                type="button"
                class="btn"
                data-value="Out &amp; In"
                data-span="half"
              >
                Out &amp; In
              </button>
              <button
                type="button"
                class="btn"
                data-value="Linear"
                data-span="full"
              >
                Linear
              </button>
            </div>
            <button type="button" class="btn" data-span="full" id="play">
              Play
            </button>
          </div>
        </section>

        <section class="group">
          <h2>Export</h2>
          <div class="rows">
            <div class="segmented" data-select="format">
              <button
                type="button"
                class="btn"
                data-value="png"
                data-span="third"
              >
                PNG
              </button>
              <button
                type="button"
                class="btn"
                data-value="mp4"
                data-span="third"
              >
                MP4
              </button>
              <button
                type="button"
                class="btn"
                data-value="frames"
                data-span="third"
              >
                Frames
              </button>
            </div>
            <label class="ctl" id="widthRow">
              <span>Width</span>
              <span class="track">
                <input
                  type="range"
                  id="width"
                  min="330"
                  max="2640"
                  step="30"
                  value="990"
                />
                <input class="nub" id="widthOut" value="990" readonly />
              </span>
            </label>
            <label class="ctl" id="fpsRow">
              <span>FPS</span>
              <span class="track">
                <input
                  type="range"
                  id="fps"
                  min="12"
                  max="60"
                  step="1"
                  value="30"
                />
                <input class="nub" id="fpsOut" value="30" readonly />
              </span>
            </label>
            <label class="ctl" id="bitrateRow">
              <span>Bitrate</span>
              <span class="track">
                <input
                  type="range"
                  id="bitrate"
                  min="2"
                  max="40"
                  step="1"
                  value="12"
                />
                <input class="nub" id="bitrateOut" value="12" readonly />
              </span>
            </label>
            <button type="button" class="btn" data-span="full" id="export">
              Export
            </button>
          </div>
        </section>
      </div>

      <div class="dock">
        <button type="button" class="btn" data-span="full" id="reset">
          Reset
        </button>
      </div>
    </aside>

  </body>
</html>
